<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#e8f1f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Expense Tracker</title>
<style>
:root{color-scheme:only light;--bg:#e8f1f0;--b1:rgba(234,162,124,.7);--b2:rgba(14,137,145,.32);--b3:rgba(141,182,188,.75);--card:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8);--tx:#0c313a;--mut:#55767b;--br:rgba(12,49,58,.12);--sheet:rgba(240,248,247,.88);--navbg:rgba(255,255,255,.72);--hero:linear-gradient(135deg,#0c313a 0%,#0e8991 100%);--htx:#fff;--hmut:rgba(255,255,255,.74);--fab:linear-gradient(135deg,#eaa27c,#e8bba8);--fabtx:#0c313a;--out:#e11d48;--in:#16a34a;--ac:#0b7a82;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}

/* Top Header: Month/Year Dropdown & Privacy Mode Toggle */
header{position:sticky;top:0;z-index:5;background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.5);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.mon{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.date-pick{flex:1;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--gb);border-radius:14px;padding:3px 6px;box-shadow:0 4px 12px rgba(12,49,58,.05)}
.sel-wrap{position:relative;display:flex;align-items:center}
.sel-wrap.m-wrap{flex:1}
.sel-wrap select{width:100%;appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:7px 26px 7px 10px;font-size:15px;font-weight:700;color:var(--tx);cursor:pointer;border-radius:10px;backdrop-filter:none;-webkit-backdrop-filter:none}
.sel-wrap select:focus{outline:none;background:rgba(11,122,130,.08)}
.sel-wrap svg{position:absolute;right:8px;width:14px;height:14px;pointer-events:none;color:var(--mut);fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.date-sep{width:1px;height:20px;background:var(--br);flex:none}
.icon-btn{width:40px;height:40px;flex:none;border:1px solid var(--gb);border-radius:14px;background:var(--card);color:var(--tx);display:grid;place-items:center;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .15s ease;box-shadow:0 4px 12px rgba(12,49,58,.05)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{background:color-mix(in srgb,var(--ac) 14%,rgba(255,255,255,.7));border-color:color-mix(in srgb,var(--ac) 35%,transparent);color:var(--ac)}

main{max-width:480px;margin:0 auto;padding:8px 16px 4px;transition:opacity .15s}
.busy main{opacity:.45}
section>h2{font-size:15px;margin:22px 0 8px;font-weight:700}

/* Hero Card */
.hero{background:var(--hero);color:var(--htx);border-radius:28px;padding:22px;border:1px solid rgba(255,255,255,.25);box-shadow:0 14px 34px rgba(12,49,58,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.hero small{color:var(--hmut);font-size:13px;display:block}
.big{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin:4px 0 2px}
.big span{font-size:20px;font-weight:600;opacity:.8;margin-right:4px}
.chg{font-size:13px;color:var(--hmut)}
.sbar{display:flex;gap:3px;height:20px;padding:4px;background:rgba(255,255,255,.2);border-radius:99px;margin:16px 0}
.sbar i{border-radius:99px;min-width:6px}
.hrow{display:flex;gap:10px}
.hrow>div{flex:1;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px;min-width:0}
.hrow b{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Cards & Transactions */
.card{background:var(--card);border:1px solid var(--gb);border-radius:20px;padding:16px}
.kb{margin:0 0 12px}.kb:last-child{margin:0}
.kb div{display:flex;justify-content:space-between;gap:8px}
.kb small{color:var(--mut)}
.track{height:8px;background:var(--br);border-radius:4px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--br);cursor:pointer}
.tx:last-child{border:0}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-style:normal}
.av.em{font-size:20px;font-weight:400;line-height:1}
.tm{min-width:0}
.tm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.neg{color:var(--out);font-weight:700}.pos{color:var(--in);font-weight:700}
.act{grid-column:1/-1;display:none;justify-content:flex-end;padding-top:4px}
.tx.open .act{display:flex}
.del{border:1px solid var(--out);color:var(--out);background:none;border-radius:10px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.del.sure{background:var(--out);color:#fff}
.del:disabled{opacity:.75}

/* Transactions Tab: Date & Category Filters + Clear Date Headers */
.flt-row{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.flt-sel{flex:1;min-width:0;position:relative;display:flex;align-items:center;background:var(--card);border:1px solid var(--gb);border-radius:12px;transition:border-color .18s ease,background .18s ease}
.flt-sel.active{border-color:color-mix(in srgb,var(--ac) 45%,transparent);background:color-mix(in srgb,var(--ac) 10%,rgba(255,255,255,.72))}
.flt-sel select{width:100%;appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:9px 26px 9px 11px;font-size:13px;font-weight:600;color:var(--tx);cursor:pointer;border-radius:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:none;-webkit-backdrop-filter:none}
.flt-sel.active select{color:var(--ac)}
.flt-sel select:focus{outline:none}
.flt-sel svg{position:absolute;right:8px;width:14px;height:14px;pointer-events:none;color:var(--mut);fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.flt-sel.active svg{color:var(--ac)}
.flt-clr{flex:none;border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);background:color-mix(in srgb,var(--ac) 12%,rgba(255,255,255,.65));color:var(--ac);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 11%,rgba(255,255,255,.62));border:1px solid color-mix(in srgb,var(--ac) 16%,rgba(255,255,255,.8))}
.dh-main{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--tx);letter-spacing:-.1px}
.dh-main svg{width:15px;height:15px;color:var(--ac);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dh-cnt{font-size:11.5px;font-weight:700;color:var(--ac);background:rgba(255,255,255,.72);padding:2px 8px;border-radius:99px;white-space:nowrap}
.day-card{padding:0 14px;border-radius:18px;margin-bottom:4px}

/* Segmented Controls & Charts */
.seg{display:flex;background:var(--card);border:1px solid var(--gb);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:9px;font-weight:600;transition:background .18s ease,color .18s ease}
.seg button.on{background:var(--ac);color:var(--on)}
.cv{position:relative;height:210px}
.cv-donut{height:244px;display:flex;align-items:center;justify-content:center}
.d3-donut{width:100%;height:100%}
.d3-donut svg{width:100%;height:100%;display:block;overflow:visible}
.d3-slice{cursor:pointer;transition:opacity .2s ease}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 26%}
.donut-center small{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.35px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-center b{font-size:16px;font-weight:800;color:var(--tx);line-height:1.2;margin-top:3px;word-break:break-word}
.donut-center em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ac);margin-top:2px}
.lg{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--br);border-radius:10px;cursor:pointer;transition:background .15s ease}
.lg.active{background:color-mix(in srgb,var(--ac) 11%,transparent)}
.lg i{width:12px;height:12px;border-radius:4px;flex:none}
.lg span{flex:1}.lg em{color:var(--mut);font-style:normal;font-size:13px}

/* Reports Tab: Minimalist Calendar & Weekly Bar Chart */
.rep-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 8px}
.rep-head h2{margin:0;font-size:15px;font-weight:700}
.cal-sub{font-size:12px;color:var(--mut);font-weight:600}
.cal-card{padding:14px 10px 12px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
.cal-dow span{font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.45px;text-transform:uppercase}
.cal-weeks{display:flex;flex-direction:column;gap:3px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:3px 2px;border-radius:14px;transition:background .2s ease}
.cal-week.wk-on{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.cal-cell{border:0;background:none;padding:4px 1px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:46px;gap:2px;transition:background .15s ease,transform .12s ease}
.cal-cell:active{transform:scale(.94)}
.cal-cell.empty-c{pointer-events:none}
.cal-num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:600;color:var(--tx);line-height:1;transition:background .15s ease,color .15s ease}
.cal-cell.today .cal-num{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:800}
.cal-cell.sel .cal-num{background:var(--ac);color:var(--on);font-weight:800;box-shadow:0 3px 10px rgba(11,122,130,.28)}
.cal-val{font-size:9.5px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px}
.cal-val.neg{color:var(--out)}
.cal-val.pos{color:var(--in)}
.cal-val.zero{visibility:hidden}

.wk-nav{display:inline-flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--gb);border-radius:99px;padding:3px 4px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.wk-nav button{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--tx);display:grid;place-items:center;transition:background .15s ease,opacity .15s ease}
.wk-nav button:hover:not(:disabled){background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac)}
.wk-nav button:disabled{opacity:.3;cursor:default}
.wk-nav button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wk-period{font-size:12px;font-weight:700;color:var(--tx);padding:0 6px;white-space:nowrap}
.cv-wk{position:relative;height:205px;width:100%}
.cv-wk svg{width:100%;height:100%;display:block;overflow:visible}
.wk-bar-g{cursor:pointer}
.wk-tip{margin-top:8px;padding-top:10px;border-top:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.wk-tip b{color:var(--tx);font-weight:700}

.empty{color:var(--mut);text-align:center;padding:26px 8px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.st small{display:block;color:var(--mut);font-size:12px}
.tren-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.tren-head h2{margin:0;font-size:15px;font-weight:700}
.tren-sub{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}

/* Modern Minimalist Bottom Bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--navbg);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-top:1px solid rgba(255,255,255,.75);box-shadow:0 -4px 20px rgba(12,49,58,.06);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{position:relative;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 0 2px;transition:color .2s ease}
nav button[data-t]::before{content:"";position:absolute;top:-6px;width:24px;height:3px;border-radius:99px;background:var(--ac);opacity:0;transform:scaleX(.3);transition:opacity .22s ease,transform .22s cubic-bezier(.34,1.56,.64,1)}
nav button[data-t].on::before{opacity:1;transform:scaleX(1)}
nav .nav-ic{width:44px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .22s ease,transform .2s cubic-bezier(.34,1.56,.64,1)}
nav button[data-t].on{color:var(--ac);font-weight:700}
nav button[data-t].on .nav-ic{background:color-mix(in srgb,var(--ac) 14%,transparent);transform:translateY(-1px)}
nav button[data-t].on svg{fill:color-mix(in srgb,var(--ac) 16%,transparent);stroke-width:2.2}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .2s ease,fill .2s ease}
nav .fab{width:56px;height:56px;border-radius:50%;background:var(--fab);color:var(--fabtx);margin:0 auto;margin-top:-30px;justify-content:center;border:4px solid var(--bg);box-shadow:0 8px 22px rgba(234,162,124,.5);padding:0}
nav .fab svg{width:26px;height:26px;stroke-width:2.5}

/* Bottom Sheet Modal */
.bd{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.bd.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sheet);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--gb);border-bottom:0;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:520px;margin:0 auto}
.sheet.open{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh b{font-size:18px}
.sh button{border:0;background:var(--card);width:36px;height:36px;border-radius:50%}
label{display:block;margin:16px 0 6px;color:var(--mut);font-size:14px}
input,select{width:100%;padding:12px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--gb);border-radius:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--tx);padding:4px 0;margin-top:14px}
.amt span{color:var(--mut);font-size:20px}
.amt input{border:0;background:none;padding:0;font-size:42px;font-weight:800;letter-spacing:-1px}
.amt input:focus{outline:0}
#baru-wrap{margin-top:10px}
.epick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.eb{height:38px;border:1px solid var(--gb);border-radius:10px;background:var(--card);font-size:18px;display:grid;place-items:center;padding:0;transition:.15s}
.eb.on{background:var(--ac);border-color:var(--ac);transform:scale(1.06)}
.ecust{display:flex;align-items:center;gap:10px;margin-top:10px}
.ecust span{font-size:13px;color:var(--mut);white-space:nowrap}
.ecust input{width:72px;text-align:center;padding:8px;font-size:18px}
.btn{width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;background:var(--hero);color:var(--htx);font-weight:700;font-size:17px;box-shadow:0 8px 20px rgba(14,137,145,.35);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.65}

/* Loaders, Toast & Glass Backdrop */
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex:none}
.spin.sm{width:14px;height:14px;border-width:2px}
.spin.dark{border-color:rgba(11,122,130,.22);border-top-color:var(--ac)}
@keyframes sp{to{transform:rotate(360deg)}}
#loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s}
#loader.on{opacity:1}
#loader::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,var(--ac),#eaa27c,transparent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:10;transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--out);color:#fff}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 38% at 8% 2%,var(--b1),transparent 70%),radial-gradient(60% 36% at 100% 22%,var(--b2),transparent 70%),radial-gradient(70% 40% at 0% 100%,var(--b3),transparent 70%)}
.card,.seg,.date-pick,.icon-btn,.flt-sel,input,select{backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.card{box-shadow:0 8px 24px rgba(12,49,58,.08),inset 0 1px 0 rgba(255,255,255,.35)}
.av.neg{background:color-mix(in srgb,var(--out) 16%,transparent)}
.av.pos{background:color-mix(in srgb,var(--in) 16%,transparent)}

/* Setup Screen */
#p-setup{position:fixed;inset:0;z-index:99;background:var(--bg);padding:calc(20px + env(safe-area-inset-top)) 20px;overflow:auto;display:flex;flex-direction:column;justify-content:center}
#p-setup .setup-box{width:100%;max-width:440px;margin:0 auto}
#p-setup h1{font-size:24px;margin:0 0 8px;text-align:center}
#p-setup p{color:var(--mut);text-align:center;font-size:14px;margin:0 0 24px}
#p-setup .pwd-wrap{position:relative}
#p-setup .pwd-wrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ac);font-weight:bold;font-size:13px}
.noscr{background:color-mix(in srgb,var(--out) 12%,rgba(255,255,255,.85));border:1px solid color-mix(in srgb,var(--out) 35%,transparent);color:var(--out);padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;text-align:center;margin-bottom:18px}
.cfg-reset{margin:20px auto 0;display:block;background:none;border:1px solid var(--gb);padding:8px 16px;border-radius:10px;color:var(--mut);font-size:13px}
.cfg-reset.sure{border-color:var(--out);color:var(--out)}
</style>
</head>
<body>
<div id="loader" aria-hidden="true"></div>

<!-- Initial Setup Screen (Shown by default until valid token is detected) -->
<div id="p-setup">
  <div class="setup-box">
    <noscript><div class="noscr">JavaScript tidak aktif pada mode pratinjau ini. Silakan buka file langsung di browser (Chrome/Safari/Edge) atau melalui web server.</div></noscript>
    <h1>Welcome!</h1>
    <p>Enter your Apps Script URL &amp; Token to connect this app to your Google Sheet.</p>
    <label for="setup-url">Apps Script URL (/exec)</label>
    <input id="setup-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false">
    
    <label for="setup-token" style="margin-top:16px;">App Token</label>
    <div class="pwd-wrap">
      <input id="setup-token" type="password" placeholder="Paste token here" autocomplete="off" spellcheck="false">
      <button id="setup-toggle" type="button">SHOW</button>
    </div>
    
    <button id="setup-btn" class="btn" style="margin-top:32px;">Connect</button>
  </div>
</div>

<!-- Main App Container (Hidden until authenticated) -->
<div id="app-content" class="hide">
  <!-- Top Navigation: Month/Year Dropdown & Privacy Mode Button -->
  <header>
    <div class="mon">
      <div class="date-pick">
        <div class="sel-wrap m-wrap">
          <select id="sel-month" aria-label="Select month"></select>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <span class="date-sep" aria-hidden="true"></span>
        <div class="sel-wrap">
          <select id="sel-year" aria-label="Select year"></select>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <button id="priv-btn" class="icon-btn" type="button" aria-label="Toggle privacy mode" aria-pressed="false" title="Privacy Mode">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Home Tab -->
    <section id="p-home">
      <div class="hero" id="hero"><small style="display:inline-flex;align-items:center;gap:8px"><span class="spin sm"></span>Loading data…</small></div>
      <h2>Expenses by category</h2>
      <div class="card" id="topk"></div>
      <h2>Recent transactions</h2>
      <div class="card" id="recent"></div>
    </section>

    <!-- Transactions Tab -->
    <section id="p-list" class="hide">
      <div class="seg" id="flt"><button data-v="all" class="on">All</button><button data-v="Pengeluaran">Expense</button><button data-v="Pemasukan">Income</button></div>
      <div class="flt-row">
        <div class="flt-sel" id="flt-tgl-wrap">
          <select id="flt-tgl" aria-label="Filter by date"><option value="all">All dates</option></select>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="flt-sel" id="flt-kat-wrap">
          <select id="flt-kat" aria-label="Filter by category"><option value="all">All categories</option></select>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <button id="flt-reset" class="flt-clr hide" type="button" aria-label="Reset filters">Reset</button>
      </div>
      <div id="txs"></div>
    </section>

    <!-- Reports Tab -->
    <section id="p-rep" class="hide">
      <div class="seg" id="ctipe"><button data-v="Pengeluaran" class="on">Expense</button><button data-v="Pemasukan">Income</button></div>
      <div class="card">
        <div class="cv cv-donut">
          <div id="c1-d3" class="d3-donut"></div>
          <div class="donut-center" id="c1-center"></div>
        </div>
      </div>
      <div id="leg"></div>

      <div class="rep-head">
        <h2>Calendar</h2>
        <span class="cal-sub" id="cal-sub"></span>
      </div>
      <div class="card cal-card" id="rep-cal"></div>

      <div class="rep-head">
        <h2>Daily</h2>
        <div class="wk-nav">
          <button id="wk-prev" type="button" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="wk-period" id="wk-period">—</span>
          <button id="wk-next" type="button" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="card">
        <div class="cv-wk" id="c2-d3"></div>
        <div class="wk-tip" id="wk-tip"></div>
      </div>
    </section>

    <!-- Trends Tab -->
    <section id="p-tren" class="hide">
      <div class="seg" id="trange">
        <button data-v="1m">1M</button>
        <button data-v="3m" class="on">3M</button>
        <button data-v="6m">6M</button>
        <button data-v="1y">1Y</button>
      </div>
      <div class="tren-head">
        <h2 id="tren-title">Last 3 months</h2>
        <span class="tren-sub" id="tren-sub">Monthly</span>
      </div>
      <div class="card"><div class="cv"><canvas id="c3"></canvas></div></div>
      <div class="st" id="tst"></div>
      <button id="reset-cfg" class="cfg-reset">Reset API Settings</button>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav>
    <button data-t="home" class="on"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></button>
    <button data-t="list"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span>Transactions</span></button>
    <button class="fab" id="add" aria-label="Add transaction"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-t="rep"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span><span>Reports</span></button>
    <button data-t="tren"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></span><span>Trends</span></button>
  </nav>

  <!-- Add Transaction Bottom Sheet -->
  <div class="bd" id="bd"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Add transaction">
    <div class="sh"><b>New transaction</b><button id="close" aria-label="Close">✕</button></div>
    <div class="seg" id="tipe"><button data-v="Pengeluaran" class="on">Expense</button><button data-v="Pemasukan">Income</button></div>
    <div class="amt"><span>Rp</span><input id="nom" inputmode="numeric" placeholder="0" autocomplete="off" aria-label="Amount"></div>
    <label for="kat">Category</label>
    <select id="kat" aria-label="Category"></select>
    <div id="baru-wrap" class="hide">
      <input id="baru" placeholder="New category name" maxlength="30">
      <label style="margin-top:12px">Category icon (Emoji)</label>
      <div class="epick" id="epick"></div>
      <div class="ecust">
        <span>Or custom emoji:</span>
        <input id="ikon-custom" placeholder="😀" maxlength="8" autocomplete="off" aria-label="Custom emoji">
      </div>
    </div>
    <label for="tgl">Date</label><input type="date" id="tgl">
    <label for="cat">Note</label><input id="cat" placeholder="Optional" maxlength="100">
    <button id="simpan" class="btn">Save transaction</button>
  </div>
</div>
<div id="toast"></div>

<script>
// Register Service Worker for PWA support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
  });
}

// Load saved configuration & privacy preference
let CFG = null;
try { CFG = JSON.parse(localStorage.getItem('trk_cfg')); } catch (e) {}
let initPriv = false;
try { initPriv = localStorage.getItem('trk_priv') === '1'; } catch (e) {}

// DOM & formatting helpers
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const MASK = 'Rp ••••••';
const rp = n => S.priv ? MASK : ('Rp ' + Math.round(n).toLocaleString('id-ID'));
const short = v => v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + 'M' : v >= 1e3 ? Math.round(v / 1e3) + 'K' : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

const CAT_PAL = [
  '#f59e0b', '#f43f5e', '#0ea5e9', '#8b5cf6',
  '#10b981', '#f97316', '#ec4899', '#14b8a6',
  '#6366f1', '#84cc16', '#06b6d4', '#d946ef'
];
const catCol = j => CAT_PAL[j % CAT_PAL.length];

const EMOJI_PRESET = {
  Pengeluaran: ['🍔','☕','🚗','🛒','🧾','🎬','💊','🏠','👕','📱','✈️','🎓','🎁','🐾','⚡','📦'],
  Pemasukan: ['💰','🎁','💵','💼','📈','🏦','🪙','🎉','💎','✨']
};

const shiftYm = (ym, n) => {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
};

const fdate = t => {
  const [y, m, d] = t.split('-');
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'short' });
};
const fdateShort = t => {
  const [y, m, d] = t.split('-');
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
};

// Application State
let S = {
  tab: 'home',
  tipe: 'Pengeluaran',
  kat: null,
  baru: false,
  ikon: '',
  ctipe: 'Pengeluaran',
  trange: '3m',
  f: 'all',
  fTgl: 'all',
  fKat: 'all',
  bulan: today().slice(0, 7),
  priv: initPriv,
  donutSel: null,
  repWeek: null,
  repDay: null,
  d: null
}, ch = {};
let trenReqId = 0;

function toast(m, err) {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'show' + (err ? ' err' : '');
  setTimeout(() => t.className = '', 2400);
}

// Privacy Mode UI & Toggle
const ICON_EYE_OPEN = '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';

function updatePrivacyUI() {
  const btn = $('#priv-btn');
  if (!btn) return;
  btn.innerHTML = S.priv ? ICON_EYE_OFF : ICON_EYE_OPEN;
  btn.classList.toggle('on', S.priv);
  btn.setAttribute('aria-pressed', String(S.priv));
  btn.title = S.priv ? 'Privacy Mode: On (Tap to show amounts)' : 'Privacy Mode: Off (Tap to hide amounts)';
}

$('#priv-btn').onclick = () => {
  S.priv = !S.priv;
  try { localStorage.setItem('trk_priv', S.priv ? '1' : '0'); } catch (e) {}
  updatePrivacyUI();
  paint();
  toast(S.priv ? 'Privacy Mode enabled' : 'Privacy Mode disabled');
};
updatePrivacyUI();

// Month & Year Dropdown Initialization
function initDateDropdowns() {
  const selM = $('#sel-month');
  const selY = $('#sel-year');
  const curYear = +today().slice(0, 4);
  selM.innerHTML = Array.from({ length: 12 }, (_, idx) => {
    const val = String(idx + 1).padStart(2, '0');
    const name = new Date(2024, idx, 1).toLocaleDateString('en-US', { month: 'long' });
    return `<option value="${val}">${name}</option>`;
  }).join('');

  const years = [];
  for (let y = curYear + 2; y >= curYear - 8; y--) years.push(y);
  selY.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
}

function syncDateDropdowns() {
  const [y, m] = S.bulan.split('-');
  const selY = $('#sel-year');
  if (![...selY.options].some(o => o.value === y)) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    selY.appendChild(opt);
  }
  $('#sel-month').value = m;
  selY.value = y;
}

function onDateSelectChange() {
  const ym = $('#sel-year').value + '-' + $('#sel-month').value;
  if (ym !== S.bulan) {
    S.bulan = ym;
    S.fTgl = 'all';
    S.fKat = 'all';
    S.donutSel = null;
    S.repWeek = null;
    S.repDay = null;
    load();
  }
}
initDateDropdowns();
$('#sel-month').onchange = onDateSelectChange;
$('#sel-year').onchange = onDateSelectChange;

// Auth & Network Request Handler
function logout() {
  try { localStorage.removeItem('trk_cfg'); } catch (e) {}
  CFG = null;
  $('#app-content').classList.add('hide');
  $('#p-setup').classList.remove('hide');
}

let activeReq = 0;
function setBusy(on) {
  activeReq = Math.max(0, activeReq + (on ? 1 : -1));
  $('#loader').classList.toggle('on', activeReq > 0);
}

const run = async (action, payload = {}) => {
  if (!CFG || !CFG.url || !CFG.token) {
    logout();
    throw new Error('Incomplete configuration');
  }
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  setBusy(true);

  try {
    const response = await fetch(CFG.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: CFG.token, action, payload }),
      signal: controller.signal,
      redirect: 'follow'
    });
    clearTimeout(timeout);
    const res = await response.json();
    if (!res.ok) {
      if (res.error === 'unauthorized') {
        logout();
        throw new Error('Token rejected. Please log in again.');
      }
      throw new Error(res.error || 'An error occurred');
    }
    return res.data;
  } catch (err) {
    clearTimeout(timeout);
    if (err.name === 'AbortError') throw new Error('Connection timed out.');
    throw err;
  } finally {
    setBusy(false);
  }
};

// Setup Screen Events
$('#setup-toggle').onclick = (e) => {
  const inp = $('#setup-token');
  if (inp.type === 'password') { inp.type = 'text'; e.target.textContent = 'HIDE'; }
  else { inp.type = 'password'; e.target.textContent = 'SHOW'; }
};

$('#setup-btn').onclick = async () => {
  const url = $('#setup-url').value.trim();
  const token = $('#setup-token').value.trim();
  if (!url || !token) return toast('Please enter both URL and Token', true);

  const b = $('#setup-btn');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span>Connecting…';

  CFG = { url, token };
  try {
    await run('ping');
    try { localStorage.setItem('trk_cfg', JSON.stringify(CFG)); } catch (e) {}
    toast('Connected!');
    $('#p-setup').classList.add('hide');
    $('#app-content').classList.remove('hide');
    load();
  } catch (e) {
    CFG = null;
    toast(e.message, true);
  }
  b.disabled = false;
  b.textContent = 'Connect';
};

let resetTimer = null;
$('#reset-cfg').onclick = (e) => {
  const b = e.currentTarget;
  if (!b.classList.contains('sure')) {
    b.classList.add('sure');
    b.textContent = 'Tap again to confirm reset';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      b.classList.remove('sure');
      b.textContent = 'Reset API Settings';
    }, 3500);
    return;
  }
  clearTimeout(resetTimer);
  b.classList.remove('sure');
  b.textContent = 'Reset API Settings';
  logout();
};

// Local Cache & Lazy Script Loaders (Chart.js & D3.js)
const cget = b => { try { return JSON.parse(localStorage.getItem('trk:' + b)); } catch (e) { return null; } };
const cset = (b, d) => { try { localStorage.setItem('trk:' + b, JSON.stringify(d)); } catch (e) {} };
let chartP = null;
const loadChart = () => window.Chart ? Promise.resolve() : chartP || (chartP = new Promise((ok, no) => {
  const x = document.createElement('script');
  x.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
  x.onload = ok;
  x.onerror = () => { chartP = null; no(); };
  document.head.appendChild(x);
}));
let d3P = null;
const loadD3 = () => window.d3 ? Promise.resolve() : d3P || (d3P = new Promise((ok, no) => {
  const x = document.createElement('script');
  x.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
  x.onload = ok;
  x.onerror = () => { d3P = null; no(); };
  document.head.appendChild(x);
}));

// Navigation & Segmented Control Helper
function seg(id, cb) {
  $(id).onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  };
}

function show(t) {
  S.tab = t;
  ['home', 'list', 'rep', 'tren'].forEach(x => $('#p-' + x).classList.toggle('hide', x !== t));
  $$('nav button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  paint();
  window.scrollTo(0, 0);
}
$$('nav button[data-t]').forEach(b => b.onclick = () => show(b.dataset.t));

// Category & Row Render Helpers
const getIkon = (tipe, kat) => (S.d && S.d.ikon && S.d.ikon[tipe] && S.d.ikon[tipe][kat]) || '';
const katLabel = (tipe, kat) => { const ik = getIkon(tipe, kat); return (ik ? esc(ik) + ' ' : '') + esc(kat); };

const row = (t, i) => {
  const neg = t.tipe === 'Pengeluaran';
  const ik = getIkon(t.tipe, t.kat);
  const amtText = S.priv ? MASK : ((neg ? '−' : '+') + rp(t.nom));
  return `<div class="tx" data-i="${i}"><i class="av ${neg ? 'neg' : 'pos'}${ik ? ' em' : ''}">${esc(ik || t.kat.charAt(0).toUpperCase())}</i><div class="tm"><b>${esc(t.kat)}</b>${t.cat ? `<small>${esc(t.cat)}</small>` : ''}</div><span class="${neg ? 'neg' : 'pos'}">${amtText}</span><div class="act"><button class="del" data-del="${i}">Delete</button></div></div>`;
};
const EMPTY = '<div class="empty">No transactions this month yet. Tap + to add one.</div>';
const EMPTY_FLT = '<div class="empty">No transactions match your selected filters.</div>';
const ICON_CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

// Render Home Tab
function renderHome() {
  const d = S.d; if (!d) return;
  const o = d.ringkasan.Pengeluaran, i = d.ringkasan.Pemasukan, k = d.kat.Pengeluaran;
  const prev = d.trend.length > 1 ? d.trend[d.trend.length - 2].keluar : 0;
  const p = prev > 0 ? Math.round((o - prev) / prev * 100) : null;
  const bigAmt = S.priv ? '<span>Rp</span>••••••' : `<span>Rp</span>${Math.round(o).toLocaleString('id-ID')}`;

  $('#hero').innerHTML = `<small>Expenses this month</small><div class="big">${bigAmt}</div>`
    + (p === null ? '' : `<div class="chg">${p > 0 ? '▲' : p < 0 ? '▼' : '•'} ${Math.abs(p)}% vs last month</div>`)
    + `<div class="sbar">${k.length ? k.map((x, j) => `<i style="flex:${x[1]};background:${catCol(j)}"></i>`).join('') : '<i style="flex:1;background:rgba(255,255,255,.18)"></i>'}</div>`
    + `<div class="hrow"><div><small>Income</small><b>${rp(i)}</b></div><div><small>Balance</small><b>${rp(i - o)}</b></div></div>`;

  const mx = k.length ? k[0][1] : 1;
  $('#topk').innerHTML = k.length ? k.slice(0, 5).map((x, j) => `<div class="kb"><div><span>${katLabel('Pengeluaran', x[0])}</span><span>${rp(x[1])}</span></div><div class="track"><i style="width:${x[1] / mx * 100}%;background:${catCol(j)}"></i></div></div>`).join('') : '<div class="empty">No expenses yet.</div>';
  $('#recent').innerHTML = d.list.length ? d.list.slice(0, 5).map((t, j) => row(t, j)).join('') : EMPTY;
}

// Render Transactions Tab (Date & Category Filters + Prominent Date Headers)
function populateListFilters(baseList) {
  const dates = [...new Set(baseList.map(([t]) => t.tgl))].sort((a, b) => b.localeCompare(a));
  const cats = [...new Set(baseList.map(([t]) => t.kat))].sort((a, b) => a.localeCompare(b));

  if (S.fTgl !== 'all' && !dates.includes(S.fTgl)) S.fTgl = 'all';
  if (S.fKat !== 'all' && !cats.includes(S.fKat)) S.fKat = 'all';

  $('#flt-tgl').innerHTML = '<option value="all">All dates</option>'
    + dates.map(dt => `<option value="${dt}">${esc(fdateShort(dt))}</option>`).join('');
  $('#flt-tgl').value = S.fTgl;

  $('#flt-kat').innerHTML = '<option value="all">All categories</option>'
    + cats.map(ct => {
        const sample = baseList.find(([t]) => t.kat === ct);
        const ik = sample ? getIkon(sample[0].tipe, ct) : '';
        return `<option value="${esc(ct)}">${ik ? esc(ik) + ' ' : ''}${esc(ct)}</option>`;
      }).join('');
  $('#flt-kat').value = S.fKat;

  $('#flt-tgl-wrap').classList.toggle('active', S.fTgl !== 'all');
  $('#flt-kat-wrap').classList.toggle('active', S.fKat !== 'all');
  $('#flt-reset').classList.toggle('hide', S.fTgl === 'all' && S.fKat === 'all');
}

function renderList() {
  const d = S.d; if (!d) return;
  const base = d.list.map((t, i) => [t, i]).filter(([t]) => S.f === 'all' || t.tipe === S.f);
  populateListFilters(base);

  const filtered = base.filter(([t]) =>
    (S.fTgl === 'all' || t.tgl === S.fTgl) &&
    (S.fKat === 'all' || t.kat === S.fKat)
  );

  if (!filtered.length) {
    $('#txs').innerHTML = d.list.length ? EMPTY_FLT : EMPTY;
    return;
  }

  const groups = new Map();
  filtered.forEach(item => {
    const dt = item[0].tgl;
    if (!groups.has(dt)) groups.set(dt, []);
    groups.get(dt).push(item);
  });

  let h = '';
  groups.forEach((items, dt) => {
    const cntLabel = items.length === 1 ? '1 item' : `${items.length} items`;
    h += `<div class="dh"><span class="dh-main">${ICON_CAL}<span>${esc(fdate(dt))}</span></span><span class="dh-cnt">${cntLabel}</span></div>`
      + `<div class="card day-card">${items.map(([t, i]) => row(t, i)).join('')}</div>`;
  });
  $('#txs').innerHTML = h;
}

// Chart.js Base Helpers (used in Trends Tab)
function setChart(k, cfg) { ch[k] && ch[k].destroy(); ch[k] = new Chart($('#' + k), cfg); }
function chartBase() {
  const cs = getComputedStyle(document.body);
  Chart.defaults.font.family = '"Plus Jakarta Sans", system-ui, -apple-system, sans-serif';
  Chart.defaults.color = cs.getPropertyValue('--mut');
  Chart.defaults.borderColor = cs.getPropertyValue('--br');
  return cs;
}
const valAxis = { ticks: { callback: v => S.priv ? '•••' : short(v) } };

// Reports Tab: D3.js Interactive Donut, Minimalist Calendar & Weekly Bar Chart
const DOW_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function getMonthWeeks(ym, harianArr) {
  const [y, m] = ym.split('-').map(Number);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const weeks = [];
  let cur = new Array(7).fill(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const dow = (firstDow + day - 1) % 7;
    cur[dow] = {
      day,
      dateStr: `${ym}-${String(day).padStart(2, '0')}`,
      val: (harianArr && harianArr[day - 1]) || 0
    };
    if (dow === 6 || day === daysInMonth) {
      weeks.push(cur);
      cur = new Array(7).fill(null);
    }
  }
  return weeks;
}

function getActiveWeekIndex(weeks) {
  if (S.repWeek !== null && S.repWeek >= 0 && S.repWeek < weeks.length) return S.repWeek;
  const td = today();
  if (td.startsWith(S.bulan)) {
    const idx = weeks.findIndex(w => w.some(c => c && c.dateStr === td));
    if (idx >= 0) return idx;
  }
  return 0;
}

function updateDonutCenter(k, t, rawTot, tot, idx) {
  const center = $('#c1-center');
  if (!k.length) { center.innerHTML = ''; return; }
  if (idx !== null && idx >= 0 && idx < k.length) {
    const item = k[idx];
    const pct = Math.round(item[1] / tot * 100);
    center.innerHTML = `<small>${katLabel(t, item[0])}</small><b>${rp(item[1])}</b><em>${pct}%</em>`;
  } else {
    center.innerHTML = `<small>${t === 'Pengeluaran' ? 'Total Expense' : 'Total Income'}</small><b>${rp(rawTot)}</b>`;
  }
}

function renderD3Donut(k, t, rawTot, tot) {
  const host = $('#c1-d3');
  if (!host) return;
  host.innerHTML = '';

  const d3 = window.d3;
  const w = Math.max(220, host.clientWidth || 240);
  const h = Math.max(220, host.clientHeight || 240);
  const size = Math.min(w, h);
  const rOut = size * 0.43;
  const rIn = rOut * 0.67;

  const svg = d3.select(host).append('svg')
    .attr('viewBox', `${-w / 2} ${-h / 2} ${w} ${h}`)
    .attr('role', 'img')
    .attr('aria-label', 'Category breakdown donut chart');

  if (!k.length) {
    svg.append('circle')
      .attr('r', (rOut + rIn) / 2)
      .attr('fill', 'none')
      .attr('stroke', 'rgba(12,49,58,0.1)')
      .attr('stroke-width', rOut - rIn);
    return;
  }

  const pie = d3.pie().value(d => d[1]).sort(null).padAngle(k.length > 1 ? 0.025 : 0);
  const arc = d3.arc().innerRadius(rIn).outerRadius(rOut).cornerRadius(6);
  const arcHover = d3.arc().innerRadius(rIn - 2).outerRadius(rOut + 8).cornerRadius(7);
  const arcsData = pie(k);

  const slices = svg.selectAll('path.d3-slice')
    .data(arcsData)
    .join('path')
    .attr('class', 'd3-slice')
    .attr('fill', (_, j) => catCol(j))
    .attr('d', arc);

  function applyHighlight(activeIdx) {
    slices.transition().duration(180)
      .attr('d', (d, j) => (activeIdx === j ? arcHover(d) : arc(d)))
      .style('opacity', (_, j) => (activeIdx === null || activeIdx === j ? 1 : 0.42));
    $$('#leg .lg').forEach((el, j) => el.classList.toggle('active', activeIdx === j));
    updateDonutCenter(k, t, rawTot, tot, activeIdx);
  }

  slices
    .on('mouseenter', function (_, d) {
      applyHighlight(d.index);
    })
    .on('mouseleave', function () {
      applyHighlight(S.donutSel);
    })
    .on('click', function (ev, d) {
      ev.stopPropagation();
      S.donutSel = S.donutSel === d.index ? null : d.index;
      applyHighlight(S.donutSel);
    });

  svg.on('click', () => {
    if (S.donutSel !== null) {
      S.donutSel = null;
      applyHighlight(null);
    }
  });

  $$('#leg .lg').forEach((el, j) => {
    el.onclick = () => {
      S.donutSel = S.donutSel === j ? null : j;
      applyHighlight(S.donutSel);
    };
  });

  if (S.donutSel !== null && S.donutSel < k.length) {
    applyHighlight(S.donutSel);
  }
}

function renderRepCalendar(weeks, activeWk, t) {
  const [y, m] = S.bulan.split('-').map(Number);
  $('#cal-sub').textContent = new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const td = today();
  const isNeg = t === 'Pengeluaran';

  const headerHtml = `<div class="cal-dow">${DOW_LABELS.map(d => `<span>${d}</span>`).join('')}</div>`;
  const weeksHtml = weeks.map((wk, wIdx) => {
    const cells = wk.map(c => {
      if (!c) return '<div class="cal-cell empty-c" aria-hidden="true"></div>';
      const isToday = c.dateStr === td;
      const isSel = S.repDay === c.dateStr;
      const valText = c.val > 0 ? (S.priv ? '•••' : short(c.val)) : '0';
      const valCls = c.val > 0 ? (isNeg ? 'neg' : 'pos') : 'zero';
      return `<button type="button" class="cal-cell${isToday ? ' today' : ''}${isSel ? ' sel' : ''}" data-wk="${wIdx}" data-day="${c.dateStr}">`
        + `<span class="cal-num">${c.day}</span>`
        + `<span class="cal-val ${valCls}">${valText}</span>`
        + `</button>`;
    }).join('');
    return `<div class="cal-week${wIdx === activeWk ? ' wk-on' : ''}">${cells}</div>`;
  }).join('');

  $('#rep-cal').innerHTML = headerHtml + `<div class="cal-weeks">${weeksHtml}</div>`;
  $('#rep-cal').onclick = e => {
    const cell = e.target.closest('.cal-cell[data-day]');
    if (!cell) return;
    const wIdx = +cell.dataset.wk;
    const dayStr = cell.dataset.day;
    S.repWeek = wIdx;
    S.repDay = S.repDay === dayStr ? null : dayStr;
    renderRep();
  };
}

function renderD3WeeklyBars(weeks, activeWk, t) {
  const host = $('#c2-d3');
  if (!host) return;
  host.innerHTML = '';

  const wk = weeks[activeWk] || new Array(7).fill(null);
  const [y, m] = S.bulan.split('-').map(Number);
  const monShort = new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'short' });
  const validDays = wk.filter(Boolean);
  const firstDay = validDays.length ? validDays[0].day : 1;
  const lastDay = validDays.length ? validDays[validDays.length - 1].day : 1;
  $('#wk-period').textContent = firstDay === lastDay ? `${firstDay} ${monShort}` : `${firstDay} – ${lastDay} ${monShort}`;
  $('#wk-prev').disabled = activeWk <= 0;
  $('#wk-next').disabled = activeWk >= weeks.length - 1;

  const wkTotal = validDays.reduce((a, c) => a + c.val, 0);
  const selCell = validDays.find(c => c.dateStr === S.repDay);
  const tipLabel = selCell ? fdateShort(selCell.dateStr) : `Week total (${$('#wk-period').textContent})`;
  const tipVal = selCell ? selCell.val : wkTotal;
  $('#wk-tip').innerHTML = `<span>${esc(tipLabel)}</span><b>${rp(tipVal)}</b>`;

  const d3 = window.d3;
  const cs = getComputedStyle(document.body);
  const barColor = cs.getPropertyValue(t === 'Pengeluaran' ? '--out' : '--in').trim();
  const txColor = cs.getPropertyValue('--tx').trim();
  const mutColor = cs.getPropertyValue('--mut').trim();
  const acColor = cs.getPropertyValue('--ac').trim();

  const width = Math.max(260, host.clientWidth || 320);
  const height = 205;
  const pad = { top: 28, right: 6, bottom: 40, left: 6 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;

  const data = DOW_LABELS.map((dow, i) => ({
    dow,
    day: wk[i] ? wk[i].day : null,
    dateStr: wk[i] ? wk[i].dateStr : null,
    val: wk[i] ? wk[i].val : 0
  }));

  const maxVal = d3.max(data, d => d.val) || 1;
  const x = d3.scaleBand().domain(DOW_LABELS).range([0, innerW]).padding(0.32);
  const y = d3.scaleLinear().domain([0, maxVal]).range([innerH, 0]);

  const svg = d3.select(host).append('svg')
    .attr('viewBox', `0 0 ${width} ${height}`)
    .attr('role', 'img')
    .attr('aria-label', 'Weekly daily bar chart');

  const g = svg.append('g').attr('transform', `translate(${pad.left},${pad.top})`);

  const groups = g.selectAll('g.wk-bar-g')
    .data(data)
    .join('g')
    .attr('class', 'wk-bar-g')
    .attr('transform', d => `translate(${x(d.dow)},0)`)
    .style('cursor', d => d.dateStr ? 'pointer' : 'default')
    .on('click', (_, d) => {
      if (!d.dateStr) return;
      S.repDay = S.repDay === d.dateStr ? null : d.dateStr;
      renderRep();
    });

  // Subtle background track for valid dates in this month
  groups.append('rect')
    .attr('x', 0)
    .attr('y', 0)
    .attr('width', x.bandwidth())
    .attr('height', innerH)
    .attr('rx', 7)
    .attr('fill', d => d.day ? 'rgba(12,49,58,0.055)' : 'transparent');

  // Actual value bar
  groups.append('rect')
    .attr('x', 0)
    .attr('y', d => d.val > 0 ? Math.min(y(d.val), innerH - 6) : innerH)
    .attr('width', x.bandwidth())
    .attr('height', d => d.val > 0 ? Math.max(innerH - y(d.val), 6) : 0)
    .attr('rx', 7)
    .attr('fill', barColor)
    .attr('opacity', d => (!S.repDay || S.repDay === d.dateStr) ? 0.92 : 0.38);

  // Value label above each bar
  groups.append('text')
    .attr('x', x.bandwidth() / 2)
    .attr('y', d => d.val > 0 ? Math.min(y(d.val), innerH - 6) - 7 : innerH - 6)
    .attr('text-anchor', 'middle')
    .attr('font-size', '10.5px')
    .attr('font-weight', '700')
    .attr('fill', d => S.repDay === d.dateStr ? acColor : txColor)
    .text(d => d.val > 0 ? (S.priv ? '•••' : short(d.val)) : '');

  // Fixed X-Axis day label (Sun - Sat)
  groups.append('text')
    .attr('x', x.bandwidth() / 2)
    .attr('y', innerH + 18)
    .attr('text-anchor', 'middle')
    .attr('font-size', '11px')
    .attr('font-weight', d => S.repDay === d.dateStr ? '800' : '700')
    .attr('fill', d => S.repDay === d.dateStr ? acColor : (d.day ? txColor : mutColor))
    .attr('opacity', d => d.day ? 1 : 0.45)
    .text(d => d.dow);

  // Date number below each day label
  groups.append('text')
    .attr('x', x.bandwidth() / 2)
    .attr('y', innerH + 32)
    .attr('text-anchor', 'middle')
    .attr('font-size', '10px')
    .attr('font-weight', '600')
    .attr('fill', d => S.repDay === d.dateStr ? acColor : mutColor)
    .attr('opacity', d => d.day ? 0.85 : 0.35)
    .text(d => d.day ? String(d.day) : '·');
}

function renderRep() {
  const d = S.d; if (!d) return;
  const t = S.ctipe, k = d.kat[t], h = d.harian[t];
  const rawTot = k.reduce((a, x) => a + x[1], 0), tot = rawTot || 1;
  if (S.donutSel !== null && S.donutSel >= k.length) S.donutSel = null;

  $('#leg').innerHTML = k.length ? k.map((x, j) => `<div class="lg${S.donutSel === j ? ' active' : ''}" data-idx="${j}"><i style="background:${catCol(j)}"></i><span>${katLabel(t, x[0])}</span><em>${Math.round(x[1] / tot * 100)}%</em><b>${rp(x[1])}</b></div>`).join('') : EMPTY;
  updateDonutCenter(k, t, rawTot, tot, S.donutSel);

  const weeks = getMonthWeeks(S.bulan, h);
  const activeWk = getActiveWeekIndex(weeks);
  S.repWeek = activeWk;
  renderRepCalendar(weeks, activeWk, t);

  if (S.tab !== 'rep') return;
  if (!window.d3) { loadD3().then(renderRep).catch(() => {}); return; }

  renderD3Donut(k, t, rawTot, tot);
  renderD3WeeklyBars(weeks, activeWk, t);
}

// Render Trends Tab
async function getYearTrend(currentYm, currentTrend) {
  const prevYm = shiftYm(currentYm, -6);
  let prevData = cget(prevYm);
  if (!prevData) {
    prevData = await run('load', { bulan: prevYm });
    cset(prevYm, prevData);
  }
  const map = new Map();
  (prevData && prevData.trend ? prevData.trend : []).forEach(x => map.set(x.ym, x));
  currentTrend.forEach(x => map.set(x.ym, x));
  return [...map.values()].sort((a, b) => a.ym.localeCompare(b.ym)).slice(-12);
}

function drawTrenChart(labels, outData, inData, tipTitleCb) {
  if (S.tab !== 'tren') return;
  if (!window.Chart) { loadChart().then(renderTren).catch(() => {}); return; }
  const cs = chartBase();
  setChart('c3', {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Expense', data: outData, backgroundColor: cs.getPropertyValue('--out'), borderRadius: 4 },
        { label: 'Income', data: inData, backgroundColor: cs.getPropertyValue('--in'), borderRadius: 4 }
      ]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: {
          callbacks: {
            title: tipTitleCb,
            label: c => ' ' + c.dataset.label + ': ' + rp(c.parsed.y)
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, font: { size: 11 } } },
        y: valAxis
      }
    }
  });
}

async function renderTren() {
  const d = S.d; if (!d) return;
  const reqId = ++trenReqId;
  const range = S.trange;
  const fmtMon = (ym, withYear) => new Date(ym.slice(0, 4), +ym.slice(5) - 1, 1)
    .toLocaleDateString('en-US', withYear ? { month: 'short', year: '2-digit' } : { month: 'short' });

  if (range === '1m') {
    $('#tren-title').textContent = 'Last 1 month';
    $('#tren-sub').textContent = 'Daily';
    const outArr = d.harian.Pengeluaran || [];
    const inArr = d.harian.Pemasukan || [];
    const len = Math.max(outArr.length, inArr.length);
    const labels = Array.from({ length: len }, (_, j) => String(j + 1));
    const avg = len ? outArr.reduce((a, v) => a + v, 0) / len : 0;
    let maxVal = 0, maxDay = 0;
    outArr.forEach((v, j) => { if (v > maxVal) { maxVal = v; maxDay = j + 1; } });

    $('#tst').innerHTML = `<div class="card"><small>Avg. expense / day</small><b>${rp(avg)}</b></div>`
      + `<div class="card"><small>Highest expense</small><b>${maxVal ? rp(maxVal) + ' · Day ' + maxDay : '-'}</b></div>`;
    drawTrenChart(labels, outArr, inArr, c => 'Day ' + c[0].label);
    return;
  }

  const meta = { '3m': ['Last 3 months', 3], '6m': ['Last 6 months', 6], '1y': ['Last 1 year', 12] };
  $('#tren-title').textContent = meta[range][0];
  $('#tren-sub').innerHTML = range === '1y' ? '<span class="spin sm dark"></span>Loading…' : 'Monthly';

  let T = d.trend || [];
  if (range === '3m') {
    T = T.slice(-3);
  } else if (range === '6m') {
    T = T.slice(-6);
  } else if (range === '1y') {
    try {
      T = await getYearTrend(S.bulan, T);
      if (reqId !== trenReqId) return;
      $('#tren-sub').textContent = 'Monthly';
    } catch (e) {
      if (reqId !== trenReqId) return;
      $('#tren-sub').textContent = 'Showing 6m (offline)';
      toast('Could not load full year data', true);
    }
  }

  if (!T.length) {
    $('#tst').innerHTML = '';
    return;
  }

  const avg = T.reduce((a, x) => a + x.keluar, 0) / T.length;
  const mx = T.reduce((a, x) => x.keluar > a.keluar ? x : a, T[0]);
  const showYr = range === '1y';
  $('#tst').innerHTML = `<div class="card"><small>Avg. expense / month</small><b>${rp(avg)}</b></div>`
    + `<div class="card"><small>Highest expense</small><b>${mx.keluar ? rp(mx.keluar) + ' · ' + fmtMon(mx.ym, showYr) : '-'}</b></div>`;

  drawTrenChart(
    T.map(x => fmtMon(x.ym, false)),
    T.map(x => x.keluar),
    T.map(x => x.masuk),
    c => fmtMon(T[c[0].dataIndex].ym, true)
  );
}

// Main Paint & Load Pipeline
function paint() {
  syncDateDropdowns();
  renderHome();
  renderList();
  renderRep();
  renderTren();
  drawChips();
}

function load() {
  syncDateDropdowns();
  const c = cget(S.bulan);
  if (c) { S.d = c; paint(); } else document.body.classList.add('busy');

  return run('load', { bulan: S.bulan }).then(d => {
    S.d = d;
    cset(S.bulan, d);
    paint();
  })
  .catch(e => {
    if (CFG) toast(c ? 'Offline: showing cached data' : 'Failed to load: ' + (e.message || e), true);
  })
  .finally(() => document.body.classList.remove('busy'));
}

      paint();
      toast('Transaction deleted');

      toast(err.message || 'Failed to delete', true);
      del.disabled = false;
      del.textContent = 'Confirm delete?';

  const tx = e.target.closest('.tx');
  if (tx) {

  const v = e.target.value;
  if (v === 'new') { S.baru = true; S.kat = null; S.ikon = ''; $('#ikon-custom').value = ''; drawChips(); $('#baru').focus(); }
  else { S.baru = false; S.kat = S.d.kategori[S.tipe][+v]; S.ikon = ''; drawChips(); }
};

$('#nom').oninput = e => {
  const n = e.target.value.replace(/\D/g, '').replace(/^0+/, '');
  e.target.value = n ? (+n).toLocaleString('id-ID') : '';
};

$('#simpan').onclick = async () => {
  const nominal = +$('#nom').value.replace(/\D/g, ''), kategori = S.baru ? $('#baru').value.trim() : S.kat;
  if (!nominal) return toast('Please enter an amount first', true);
  if (!kategori) return toast('Please select or add a category', true);
  const b = $('#simpan');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span>Saving…';
  try {
    const payloadData = {
      tipe: S.tipe,
      nominal,
      kategori,
      tanggal: $('#tgl').value,
      catatan: $('#cat').value.trim()
    };
    if (S.baru && S.ikon) payloadData.ikon = S.ikon;
    S.d = await run('tambah', { data: payloadData, bulan: S.bulan });
    $('#nom').value = ''; $('#cat').value = ''; $('#baru').value = ''; $('#ikon-custom').value = '';
    S.baru = false; S.kat = null; S.ikon = '';
    cset(S.bulan, S.d);
    sheet(false);
    paint();
    toast('Transaction saved');
  } catch (e) {
    toast((e && e.message) || 'Failed to save, please try again', true);
  }
  b.disabled = false;
  b.textContent = 'Save transaction';
};

// App Bootstrap
$('#tgl').value = today();
syncDateDropdowns();
if (!CFG || !CFG.url || !CFG.token) {
  $('#app-content').classList.add('hide');
  $('#p-setup').classList.remove('hide');
} else {
  $('#p-setup').classList.add('hide');
  $('#app-content').classList.remove('hide');
  load();
}

// Preload Chart.js & D3.js in background
window.addEventListener('load', () => setTimeout(() => {
  loadChart().catch(() => {});
  loadD3().catch(() => {});
}, 1200));
</script>
</body>
</html>
